    <!--
      PERF: open the network connections to the API + Supabase before the JS bundle
      parses, so DNS + TLS handshake overlaps with bundle download (saves ~100–300ms
      on the first API call). Keep these in sync with .env.production / Supabase URL.
    -->
    <link rel="preconnect" href="https://support.industryprime.dpdns.org" crossorigin />
    <link rel="dns-prefetch" href="https://support.industryprime.dpdns.org" />
    <link rel="preconnect" href="https://geqcgxassdkrymzsjpoj.supabase.co" crossorigin />
    <link rel="dns-prefetch" href="https://geqcgxassdkrymzsjpoj.supabase.co" />
    <!--
      PERF: wake the Render backend as early as possible. On the free tier the
      container sleeps after ~15 min idle and takes 10–60s to cold-start; every
      dashboard call blocks on that. Firing /health here (before the ~1.5MB JS
      bundle even parses) overlaps the wake-up with bundle download + auth, so the
      backend is already warming by the time the dashboard needs data.
      Fire-and-forget, no-cors, skipped on localhost (dev uses a local backend).
    -->
    <script>
      (function () {
        try {
          var host = window.location.hostname || "";
          var isLocal = host === "localhost" || host === "127.0.0.1" || host === "0.0.0.0";
          if (isLocal) return;
          var api =
            (window.__FMS_API_BASE_URL__ && window.__FMS_API_BASE_URL__.trim()) ||
            "https://support.industryprime.dpdns.org";
          api = api.replace(/\/+$/, "");
          if (!/^https?:\/\//.test(api)) return;
          // keepalive lets the request survive the page handing off to the SPA.
          fetch(api + "/health", { mode: "no-cors", cache: "no-store", keepalive: true }).catch(function () {});
        } catch (e) {}
      })();
    </script>

    <!-- Crawler / no-JS fallback (must be in body — not allowed in head) -->
    <noscript>
      <h1>Industry Prime — IP Internal Management Software</h1>
      <p>
        industryprime: internal FMS for client onboarding, payments, KPI dashboards, training, and support.
        JavaScript is required to sign in. Built with React, FastAPI, and Supabase.
      </p>
    </noscript>
    <div id="root"></div>
    <script>
      (function () {
        var path = window.location.pathname || "";
        var hash = (window.location.hash || "").replace(/^#/, "");
        var search = window.location.search || "";
        function parseParams(qs) {
          try { return new URLSearchParams(qs); } catch (e) { return null; }
        }
        function tokenFromParams(p) {
          if (!p) return null;
          var t = p.get("access_token");
          var type = p.get("type");
          if (!t) return null;
          if (type && type !== "recovery") return null;
          return t;
        }
        var hp = parseParams(hash);
        var sp = parseParams(search.replace(/^\?/, ""));
        var token = tokenFromParams(hp) || tokenFromParams(sp);
        if (token) {
          try {
            var refresh = (hp && hp.get("refresh_token")) || (sp && sp.get("refresh_token")) || null;
            sessionStorage.setItem(
              "fms_recovery_session",
              JSON.stringify({ access_token: token, refresh_token: refresh })
            );
            sessionStorage.setItem("fms_recovery_access_token", token);
          } catch (e) {}
        }
        var hasRecovery =
          !!token ||
          (hp && hp.get("type") === "recovery" && (hp.get("code") || hp.get("token"))) ||
          (sp && sp.get("type") === "recovery" && (sp.get("code") || sp.get("token")));
        if (hasRecovery && path !== "/reset-password") {
          window.location.replace("/reset-password" + search + (window.location.hash || ""));
        }
      })();
    </script>
