    <!-- Crawler / no-JS fallback (must be in body — not allowed in head) -->
    <noscript>
      <h1>Industry Prime — IP Internal Management Software</h1>
      <p>
        industryprime: internal FMS for client onboarding, payments, KPI dashboards, training, and support.
        JavaScript is required to sign in. Built with React, FastAPI, and Supabase.
      </p>
    </noscript>
    <div id="root"></div>
    <script>
      (function () {
        var path = window.location.pathname || "";
        var hash = (window.location.hash || "").replace(/^#/, "");
        var search = window.location.search || "";
        function parseParams(qs) {
          try { return new URLSearchParams(qs); } catch (e) { return null; }
        }
        function tokenFromParams(p) {
          if (!p) return null;
          var t = p.get("access_token");
          var type = p.get("type");
          if (!t) return null;
          if (type && type !== "recovery") return null;
          return t;
        }
        var hp = parseParams(hash);
        var sp = parseParams(search.replace(/^\?/, ""));
        var token = tokenFromParams(hp) || tokenFromParams(sp);
        if (token) {
          try {
            var refresh = (hp && hp.get("refresh_token")) || (sp && sp.get("refresh_token")) || null;
            sessionStorage.setItem(
              "fms_recovery_session",
              JSON.stringify({ access_token: token, refresh_token: refresh })
            );
            sessionStorage.setItem("fms_recovery_access_token", token);
          } catch (e) {}
        }
        var hasRecovery =
          !!token ||
          (hp && hp.get("type") === "recovery" && (hp.get("code") || hp.get("token"))) ||
          (sp && sp.get("type") === "recovery" && (sp.get("code") || sp.get("token")));
        if (hasRecovery && path !== "/reset-password") {
          window.location.replace("/reset-password" + search + (window.location.hash || ""));
        }
      })();
    </script>
